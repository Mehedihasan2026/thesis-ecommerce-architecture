server.port=8089
spring.application.name=order-service
spring.datasource.url=jdbc:h2:mem:order-service-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
services.cart.base-url=${SERVICES_CART_BASE_URL:http://localhost:8086}
services.inventory.base-url=${SERVICES_INVENTORY_BASE_URL:http://localhost:8087}
services.payment.base-url=${SERVICES_PAYMENT_BASE_URL:http://localhost:8088}
